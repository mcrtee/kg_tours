services:
  db:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: tours
      POSTGRES_USER: tours
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  app:
    build: ./app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tours:${DB_PASSWORD:-change_me}@db:5432/tours
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
