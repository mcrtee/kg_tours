<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KG Tours — управление</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--lake:#0E3B4F;--snow:#F6F8F9;--felt:#B83A2E;--ink:#12242C;--mute:#5B6B72;--line:#D8E0E3}
@media (prefers-color-scheme:dark){:root{--snow:#0C1A20;--ink:#E8EEF0;--mute:#9AABB2;--line:#223841}}
*{box-sizing:border-box}
body{margin:0;font:400 16px/1.55 Manrope,system-ui,sans-serif;background:var(--snow);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw}
.logo{font:600 15px Unbounded,sans-serif;color:var(--ink);text-decoration:none}
.header-actions,.langs{display:flex;align-items:center;gap:8px}
.langs button,.link-btn{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:600 13px Manrope;text-decoration:none}
.langs button[aria-pressed=true]{background:var(--lake);color:#fff;border-color:var(--lake)}
.link-btn{font-size:14px}
.hero{position:relative;background:linear-gradient(90deg,rgba(8,35,48,.82),rgba(8,35,48,.25)),url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=85") center 48%/cover,var(--lake);color:#fff;padding:12vh 5vw 22vh;overflow:hidden}
.hero h1{font:600 clamp(32px,6vw,68px)/1.05 Unbounded,sans-serif;margin:0 0 16px;max-width:14ch}
.hero p{max-width:46ch;opacity:.85;margin:0 0 28px;font-size:18px}
.ridge{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:20vh;min-height:110px}
.admin-tools{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.count-badge{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:6px;padding:0 6px;border-radius:999px;background:#F2B84B;color:#12242C;font:800 12px Manrope}
.btn{background:var(--felt);color:#fff;border:0;padding:12px 22px;border-radius:8px;font:800 15px Manrope,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}
.btn.light{background:#fff;color:var(--lake)}
main{padding:40px 5vw 80px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
h2{font:600 26px Unbounded,sans-serif;margin:0}
.tabs{display:flex;gap:8px}
.tab{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);padding:9px 14px;font:700 14px Manrope;cursor:pointer}
.tab[aria-selected=true]{background:var(--lake);border-color:var(--lake);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--snow)}
.card.inactive{opacity:.68}
.thumb{height:170px;position:relative;background-position:center;background-size:cover}
.thumb svg{position:absolute;bottom:0;width:100%;height:70%}
.body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font-size:19px}
.body p{margin:0;color:var(--mute);font-size:15px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.price{font-weight:800;font-size:20px;white-space:nowrap}.price small{font-weight:400;color:var(--mute);font-size:13px}
.card-actions{display:flex;gap:8px;align-items:center}
.edit-btn,.status{border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--ink);padding:8px 10px;font:700 13px Manrope;cursor:pointer}
.badge{font-size:12px;color:var(--mute)}
.panel{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--snow)}
.booking-actions{display:flex;align-items:center;gap:10px}
.refresh-btn{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);padding:9px 14px;font:700 14px Manrope;cursor:pointer}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;background:color-mix(in srgb,var(--lake) 8%,var(--snow))}
td{font-size:14px}
.status{padding:6px 8px}
#msg{min-height:1.55em;margin:12px 0;font-weight:600}
dialog{border:1px solid var(--line);border-radius:14px;padding:26px;width:min(760px,94vw);max-height:90vh;overflow:auto;background:var(--snow);color:var(--ink)}
dialog::backdrop{background:rgba(5,20,28,.6)}
dialog h2{margin-bottom:20px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--snow);color:var(--ink)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 14px}
.lang-block{margin-top:20px}
.lang-block h3{margin:0 0 8px;font-size:17px}
.dialog-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}
.empty{color:var(--mute)}
@media(max-width:600px){header{padding:14px 5vw;align-items:flex-start}.header-actions{align-items:flex-end;flex-direction:column}.hero{padding-top:9vh}.section-head{align-items:flex-start;flex-direction:column}.meta{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">KG Tours</a>
  <div class="header-actions">
    <div class="langs" role="group" aria-label="Language">
      <button data-l="ky">КЫР</button><button data-l="en">EN</button><button data-l="ru">РУС</button><button data-l="es">ES</button>
    </div>
    <a class="link-btn" href="/">Открыть сайт</a>
    <button class="link-btn" id="logout" type="button">Выйти</button>
  </div>
</header>

<section class="hero">
  <h1 data-t="h1"></h1>
  <p data-t="sub"></p>
  <div class="admin-tools">
    <button class="btn light" id="addTour" data-t="addTour"></button>
    <button class="btn" id="showBookings"><span data-t="bookings"></span><span class="count-badge" id="bookingCount" hidden></span></button>
  </div>
  <svg class="ridge" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 200V120l140-70 90 60 150-90 130 100 120-60 140 90 110-80 160 70 160-50v150z" fill="#1B5570" opacity=".6"/>
    <path d="M0 200V150l110-40 100 50 160-80 140 90 150-60 130 70 140-50 130 60 140-40v150z" fill="var(--snow)"/>
  </svg>
</section>

<main>
  <div id="msg" role="status" aria-live="polite"></div>
  <section id="tourSection">
    <div class="section-head">
      <h2 data-t="toursTitle"></h2>
      <div class="tabs" role="tablist" aria-label="Фильтр туров">
        <button class="tab" id="allTours" role="tab" aria-selected="true">Все</button>
        <button class="tab" id="activeTours" role="tab" aria-selected="false">На сайте</button>
        <button class="tab" id="hiddenTours" role="tab" aria-selected="false">Скрытые</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="bookingSection" hidden>
    <div class="section-head">
      <h2>Заявки</h2>
      <div class="booking-actions">
        <button class="refresh-btn" id="refreshBookings" type="button">Обновить</button>
        <button class="refresh-btn" id="showTours" type="button">К турам</button>
      </div>
    </div>
    <div class="panel"><table>
      <thead><tr><th>#</th><th>Получена</th><th>Тур</th><th>Имя</th><th>Контакт</th><th>Дата</th><th>Чел.</th><th>Комментарий</th><th>Статус</th></tr></thead>
      <tbody id="bBody"></tbody>
    </table></div>
  </section>
</main>

<dialog id="tourDialog">
  <form id="tourForm">
    <h2 id="formTitle">Новый тур</h2>
    <div class="form-grid">
      <div><label for="slug">slug (латиницей)</label><input id="slug" required minlength="2"></div>
      <div><label for="days">Дней</label><input id="days" type="number" min="1" value="3" required></div>
      <div><label for="price">Цена, $</label><input id="price" type="number" min="0" value="200" required></div>
      <div><label for="region">Регион</label><input id="region"></div>
      <div><label for="color">Цвет карточки</label><input id="color" type="color" value="#0E3B4F"></div>
      <div><label for="active">Показывать на сайте</label><select id="active"><option value="true">Да</option><option value="false">Нет</option></select></div>
    </div>
    <div class="lang-block"><h3>Названия</h3><div class="form-grid" id="titles"></div></div>
    <div class="lang-block"><h3>Описания</h3><div class="form-grid" id="descs"></div></div>
    <div class="dialog-actions">
      <button class="btn" id="saveTour" type="submit">Сохранить</button>
      <button class="btn secondary" id="resetForm" type="button">Сбросить форму</button>
      <button class="btn secondary" id="closeDialog" type="button">Закрыть</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const LANGS = {ky:"Кыргызча",en:"English",ru:"Русский",es:"Español"};
const STATUS = {new:"Новая",contacted:"Связались",confirmed:"Подтверждена",cancelled:"Отменена"};
const TOUR_IMAGES = {
  "issyk-kul":"https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80",
  "song-kol":"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=80",
  "ala-kul":"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80",
  "jeti-oguz":"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80"
};
const tourImage = slug => TOUR_IMAGES[slug] || TOUR_IMAGES["ala-kul"];
const TEXT = {
  ky:{h1:"KG Tours башкаруу",sub:"Турларды жана келген өтүнмөлөрдү башкарыңыз.",addTour:"Тур кошуу",bookings:"Өтүнмөлөр",toursTitle:"Турлар",days:"күн",from:"баштап",edit:"Өзгөртүү",inactive:"Сайтта жок"},
  en:{h1:"KG Tours management",sub:"Manage tours and incoming booking requests.",addTour:"Add a tour",bookings:"Bookings",toursTitle:"Tours",days:"days",from:"from",edit:"Edit",inactive:"Not on site"},
  ru:{h1:"Управление KG Tours",sub:"Управляйте турами и поступившими заявками.",addTour:"Добавить тур",bookings:"Заявки",toursTitle:"Туры",days:"дн.",from:"от",edit:"Изменить",inactive:"Не на сайте"},
  es:{h1:"Administración de KG Tours",sub:"Gestiona los tours y las solicitudes recibidas.",addTour:"Añadir tour",bookings:"Solicitudes",toursTitle:"Tours",days:"días",from:"desde",edit:"Editar",inactive:"No publicado"}
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeColor = c => /^#[0-9a-f]{6}$/i.test(c || "") ? c : "#0E3B4F";
let lang = localStorage.getItem("lang") || ({ky:"ky",ru:"ru",es:"es"}[navigator.language.slice(0,2)] || "en");
let tours = [], bookings = [], editId = null, filter = "all", currentView = "tours", bookingsLoading = false;

async function api(url, method = "GET", body) {
  const options = {method, headers:{}};
  if (body !== undefined) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const r = await fetch(url, options);
  if (r.status === 401) {            // вход истёк — возвращаем на главную
    location.href = "/";
    throw new Error("401 Unauthorized");
  }
  if (!r.ok) throw new Error(r.status + " " + await r.text());
  return r.json();
}
function say(text, bad = false) {
  $("#msg").textContent = text;
  $("#msg").style.color = bad ? "var(--felt)" : "#2F5D4A";
}
function updateLanguage() {
  const text = TEXT[lang] || TEXT.en;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = text[el.dataset.t]; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  renderTours();
}
function renderTours() {
  const text = TEXT[lang] || TEXT.en;
  const shown = tours.filter(t => filter === "all" || (filter === "active" ? t.active : !t.active));
  $("#grid").innerHTML = shown.map(t => {
    const title = t.title?.[lang] || t.title?.en || "";
    const description = t.description?.[lang] || t.description?.en || "";
    return `<article class="card ${t.active ? "" : "inactive"}">
      <div class="thumb" style="background-color:${safeColor(t.color)};background-image:linear-gradient(180deg,rgba(8,28,38,.02),rgba(8,28,38,.3)),url('${tourImage(t.slug)}')">
        <svg viewBox="0 0 200 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 80V50l40-30 30 25 35-35 40 40 25-20 30 25v25z" fill="rgba(255,255,255,.22)"/></svg>
      </div>
      <div class="body">
        <h3>${esc(title)}</h3>
        <p>${esc(description)}</p>
        <div class="meta"><span class="price"><small>${esc(text.from)}</small> $${esc(t.price_usd)} <small>· ${esc(t.days)} ${esc(text.days)}</small></span>
          <div class="card-actions">${t.active ? "" : `<span class="badge">${esc(text.inactive)}</span>`}<button class="edit-btn" data-edit="${t.id}">${esc(text.edit)}</button></div>
        </div>
      </div>
    </article>`;
  }).join("") || '<p class="empty">Туров в этой категории пока нет.</p>';
}
function setView(view) {
  const bookings = view === "bookings";
  currentView = bookings ? "bookings" : "tours";
  $("#tourSection").hidden = bookings;
  $("#bookingSection").hidden = !bookings;
  $("#tourDialog").close();
  if (bookings) loadBookings();
  else window.scrollTo({top:document.querySelector(".hero").offsetHeight,behavior:"smooth"});
}
async function loadTours() {
  try {
    tours = await api("/api/admin/tours");
    renderTours();
  } catch (err) {
    say("Не удалось загрузить туры: " + err.message, true);
  }
}
function renderBookings() {
  $("#bookingCount").textContent = String(bookings.filter(b => b.status === "new").length);
  $("#bookingCount").hidden = !bookings.some(b => b.status === "new");
  $("#bBody").innerHTML = bookings.map(b => `<tr>
    <td>${esc(b.id)}</td><td>${esc(new Date(b.created_at).toLocaleString())}</td><td>${esc(b.tour)}</td>
    <td>${esc(b.name)}</td><td>${esc(b.contact)}</td><td>${esc(b.start_date || "—")}</td>
    <td>${esc(b.people)}</td><td>${esc(b.comment || "")}</td>
    <td><select class="status" data-id="${esc(b.id)}" aria-label="Статус заявки ${esc(b.id)}">${Object.entries(STATUS).map(([k,v]) =>
      `<option value="${k}" ${k === b.status ? "selected" : ""}>${v}</option>`).join("")}</select></td></tr>`).join("")
    || '<tr><td colspan="9" class="empty">Заявок пока нет</td></tr>';
}
async function loadBookings(quiet = false) {
  if (bookingsLoading) return;
  bookingsLoading = true;
  if (!quiet && currentView === "bookings" && !bookings.length)
    $("#bBody").innerHTML = '<tr><td colspan="9">Загрузка...</td></tr>';
  try {
    bookings = await api("/api/admin/bookings");
    renderBookings();
  } catch (err) {
    if (!quiet || currentView === "bookings") {
      if (!bookings.length) $("#bBody").innerHTML = '<tr><td colspan="9">Не удалось загрузить заявки.</td></tr>';
      say("Ошибка загрузки заявок: " + err.message, true);
    }
  } finally {
    bookingsLoading = false;
  }
}
function resetForm() {
  editId = null;
  $("#formTitle").textContent = "Новый тур";
  $("#tourForm").reset();
  $("#days").value = 3;
  $("#price").value = 200;
  $("#color").value = "#0E3B4F";
  $("#active").value = "true";
  for (const k in LANGS) {
    $("#t_" + k).value = "";
    $("#d_" + k).value = "";
  }
}
function openEditor(tour) {
  resetForm();
  if (tour) {
    editId = tour.id;
    $("#formTitle").textContent = "Тур #" + tour.id;
    $("#slug").value = tour.slug;
    $("#days").value = tour.days;
    $("#price").value = tour.price_usd;
    $("#region").value = tour.region || "";
    $("#color").value = safeColor(tour.color);
    $("#active").value = String(tour.active);
    for (const k in LANGS) {
      $("#t_" + k).value = tour.title?.[k] || "";
      $("#d_" + k).value = tour.description?.[k] || "";
    }
  }
  $("#tourDialog").showModal();
}

$("#titles").innerHTML = Object.entries(LANGS).map(([k,n]) => `<div><label for="t_${k}">${esc(n)}</label><input id="t_${k}" required></div>`).join("");
$("#descs").innerHTML = Object.entries(LANGS).map(([k,n]) => `<div><label for="d_${k}">${esc(n)}</label><textarea id="d_${k}" rows="3" required></textarea></div>`).join("");
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => {
  lang = b.dataset.l;
  localStorage.setItem("lang", lang);
  updateLanguage();
});
$("#grid").onclick = e => {
  const button = e.target.closest("[data-edit]");
  if (button) openEditor(tours.find(t => t.id === Number(button.dataset.edit)));
};
$("#bBody").onchange = async e => {
  if (!e.target.dataset.id) return;
  try {
    await api("/api/admin/bookings/" + encodeURIComponent(e.target.dataset.id), "PATCH", {status:e.target.value});
    const booking = bookings.find(b => String(b.id) === e.target.dataset.id);
    if (booking) booking.status = e.target.value;
    renderBookings();
    say("Статус заявки обновлён");
  } catch (err) {
    say("Не удалось обновить статус: " + err.message, true);
    loadBookings();
  }
};
$("#tourForm").onsubmit = async e => {
  e.preventDefault();
  const p = {slug:$("#slug").value.trim(), days:Number($("#days").value), price_usd:Number($("#price").value),
    region:$("#region").value.trim() || null, color:$("#color").value, active:$("#active").value === "true",
    title:{}, description:{}};
  for (const k in LANGS) {
    p.title[k] = $("#t_" + k).value.trim();
    p.description[k] = $("#d_" + k).value.trim();
  }
  $("#saveTour").disabled = true;
  try {
    if (editId !== null) await api("/api/admin/tours/" + encodeURIComponent(editId), "PUT", p);
    else await api("/api/admin/tours", "POST", p);
    $("#tourDialog").close();
    resetForm();
    say("Тур сохранён");
    await loadTours();
  } catch (err) {
    say("Не удалось сохранить тур: " + err.message, true);
  } finally {
    $("#saveTour").disabled = false;
  }
};
$("#addTour").onclick = () => openEditor();
$("#showBookings").onclick = () => setView("bookings");
$("#showTours").onclick = () => setView("tours");
$("#refreshBookings").onclick = () => loadBookings();
$("#allTours").onclick = () => { filter = "all"; updateFilter(); };
$("#activeTours").onclick = () => { filter = "active"; updateFilter(); };
$("#hiddenTours").onclick = () => { filter = "hidden"; updateFilter(); };
$("#resetForm").onclick = resetForm;
$("#closeDialog").onclick = () => $("#tourDialog").close();
$("#logout").onclick = async () => {
  await fetch("/api/admin/logout", {method:"POST"});
  location.href = "/";
};
function updateFilter() {
  for (const [id,value] of [["allTours","all"],["activeTours","active"],["hiddenTours","hidden"]])
    $("#" + id).setAttribute("aria-selected", String(filter === value));
  renderTours();
}

updateLanguage();
loadTours();
loadBookings(true);
window.setInterval(() => loadBookings(true), 15000);
</script>
</body>
</html>
