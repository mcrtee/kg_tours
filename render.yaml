services:
  - type: web
    name: kg-tours
    runtime: docker
    plan: free
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kg-tours-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: kg-tours-db
    plan: free
    databaseName: tours
    user: tours
